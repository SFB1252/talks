name: Educational Site Quality Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install -g markdownlint-cli2
          npm install -g prettier

      - name: Check Markdown quality
        run: markdownlint-cli2 "**/*.md" "!node_modules" "!site"
        continue-on-error: true

      - name: Check code formatting
        run: prettier --check "**/*.{md,yml,yaml,json}" --ignore-path .prettierignore
        continue-on-error: true

      - name: Build MkDocs site
        run: python -m mkdocs build
        env:
          MKDOCS_ENV: production

      - name: Test HTML output
        run: |
          npm install -g html-validate
          html-validate site/**/*.html
        continue-on-error: true

  accessibility-check:
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: python -m mkdocs build

      - name: Run accessibility tests
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install axe-core
        run: npm install -g @axe-core/cli

      - name: Install ChromeDriver
        run: npx browser-driver-manager install chrome

      - name: Test accessibility
        run: |
          npx http-server site -p 8080 &
          sleep 5
          axe http://localhost:8080 --exit
        continue-on-error: true

  educational-metrics:
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Count workshop materials
        run: |
          echo "📊 SFB 1252 Workshop Series Metrics:"
          echo "Workshop count: $(find workshops -name 'README.md' | wc -l)"
          echo "Total markdown files: $(find . -name '*.md' -not -path './site/*' | wc -l)"
          echo "Images count: $(find . -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.gif' | wc -l)"
          echo ""
          echo "📋 Quality Checks Performed:"
          echo "✅ Markdown quality and formatting"
          echo "✅ Jekyll build validation"
          echo "✅ HTML output validation" 
          echo "✅ Accessibility compliance"
          echo "ℹ️  Link checking runs weekly (see weekly-link-check workflow)"

      - name: Check documentation completeness
        run: |
          # Check if each workshop has required files
          for workshop in workshops/*/; do
            if [ -d "$workshop" ]; then
              workshop_name=$(basename "$workshop")
              echo "Checking $workshop_name..."
              
              if [ ! -f "$workshop/README.md" ]; then
                echo "❌ Missing README.md in $workshop_name"
              else
                echo "✅ README.md found in $workshop_name"
              fi
            fi
          done
