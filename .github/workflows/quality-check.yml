name: Educational Site Quality Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node.js tools
        run: |
          npm install -g markdownlint-cli2
          npm install -g prettier

      - name: Check Markdown quality
        run: markdownlint-cli2 --config .markdownlint-cli2.jsonc "docs/**/*.md" "!node_modules" "!site"
        continue-on-error: true

      - name: Check code formatting
        run: prettier --check "docs/**/*.{md,yml,yaml,json}" --ignore-path .prettierignore
        continue-on-error: true

      - name: Build MkDocs site
        run: mkdocs build
        env:
          MKDOCS_ENV: production

      - name: Test HTML output
        run: |
          npm install -g html-validate
          html-validate site/**/*.html
        continue-on-error: true

  accessibility-check:
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: mkdocs build

      - name: Setup Node.js for accessibility testing
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install accessibility tools
        run: npm install -g @axe-core/cli http-server browser-driver-manager
        continue-on-error: true

      - name: Sync ChromeDriver with Chrome version
        run: npx browser-driver-manager install chrome
        continue-on-error: true

      - name: Test accessibility
        run: |
          npx http-server site -p 8080 &
          sleep 5
          npx @axe-core/cli http://localhost:8080 --exit
        continue-on-error: true

  educational-metrics:
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Count workshop materials
        run: |
          echo "📊 SFB 1252 Workshop Series Metrics:"
          echo "Workshop count: $(find docs/workshops -type d -maxdepth 1 | wc -l)"
          echo "Total markdown files: $(find docs -name '*.md' -not -path './site/*' | wc -l)"
          echo "Images count: $(find docs -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.gif' \) | wc -l)"
          echo ""
          echo "📋 Quality Checks Performed:"
          echo "✅ Markdown quality and formatting"
          echo "✅ MkDocs build validation"
          echo "✅ HTML output validation" 
          echo "✅ Accessibility compliance (WCAG 2.1)"
          echo "ℹ️  Link checking runs weekly (see weekly-link-check workflow)"

      - name: Check documentation completeness
        run: |
          # Check if each workshop has required index.md file
          for workshop in docs/workshops/*/; do
            if [ -d "$workshop" ]; then
              workshop_name=$(basename "$workshop")
              echo "Checking $workshop_name..."
              
              if [ ! -f "$workshop/index.md" ]; then
                echo "⚠️  Missing index.md in $workshop_name"
              else
                echo "✅ index.md found in $workshop_name"
              fi
            fi
          done

      - name: Report build summary
        run: |
          echo ""
          echo "🎓 Build Summary:"
          echo "Build system: MkDocs with Material theme"
          echo "Python version: 3.11"
          echo "Node.js version: 18"
          echo "Status: ✅ All quality checks completed"
