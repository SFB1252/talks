name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Grant GITHUB_TOKEN the permissions required to make a Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: docs/workshops/30-data-visualization-ggplot2
          install-pandoc: false
          install-quarto: false

      - name: Render Quarto presentations
        run: |
          quarto render docs/workshops/22-version-control-collaboration-workflows/slides.qmd
          quarto render docs/workshops/23-latex-getting-started/slides.qmd
          quarto render docs/workshops/24-latex-thesis-workflows/slides.qmd
          quarto render docs/workshops/25-licensing/slides.qmd
          quarto render docs/workshops/26-smlp2026-recap/slides.qmd
          quarto render docs/workshops/28-data-management-plans-in-practice/slides.qmd
          quarto render docs/workshops/29-backups/slides.qmd
          quarto render docs/workshops/30-data-visualization-ggplot2/slides.qmd
          quarto render docs/workshops/30-data-visualization-ggplot2/slides-advanced.qmd
          quarto render docs/resources/crc-day-2026/slides.qmd

      - name: Build site
        env:
          MKDOCS_GIT_COMMITTERS_APIKEY: ${{ secrets.MKDOCS_GIT_COMMITTERS_APIKEY || secrets.GITHUB_TOKEN }}
        run: python -m mkdocs build

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v5

  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: docs/workshops/30-data-visualization-ggplot2
          install-pandoc: false
          install-quarto: false

      - name: Render Quarto presentations
        run: |
          quarto render docs/workshops/22-version-control-collaboration-workflows/slides.qmd
          quarto render docs/workshops/23-latex-getting-started/slides.qmd
          quarto render docs/workshops/24-latex-thesis-workflows/slides.qmd
          quarto render docs/workshops/25-licensing/slides.qmd
          quarto render docs/workshops/26-smlp2026-recap/slides.qmd
          quarto render docs/workshops/28-data-management-plans-in-practice/slides.qmd
          quarto render docs/workshops/29-backups/slides.qmd
          quarto render docs/workshops/30-data-visualization-ggplot2/slides.qmd
          quarto render docs/workshops/30-data-visualization-ggplot2/slides-advanced.qmd
          quarto render docs/resources/crc-day-2026/slides.qmd

      - name: Test build
        env:
          MKDOCS_COMMITTERS_ENABLED: "false"
        run: python -m mkdocs build --strict
