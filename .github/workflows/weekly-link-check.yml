name: Link Check for Educational Resources

on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM UTC
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '**/*.md'
      - '.lychee.toml'
      - '.github/workflows/weekly-link-check.yml'
  workflow_dispatch:     # Allow manual trigger

permissions:
  contents: read

concurrency:
  group: link-check
  cancel-in-progress: true

jobs:
  link-check:
    runs-on: ubuntu-latest
    name: Check All Documentation Links
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create Markdown copies of Quarto sources
        run: |
          find docs -name '*.qmd' -print0 | while IFS= read -r -d '' f; do
            cp "$f" "${f%.qmd}.md"
          done

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress --verbose './**/*.md'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove temporary Markdown copies
        if: always()
        run: |
          find docs -name '*.qmd' -print0 | while IFS= read -r -d '' f; do
            rm -f "${f%.qmd}.md"
          done

  link-summary:
    runs-on: ubuntu-latest
    name: Link Check Summary
    needs: [link-check]
    if: always()

    steps:
      - name: Generate summary
        run: |
          {
            echo "## 📊 Link Check Summary"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Result | ${{ needs['link-check'].result }} |"
            echo "| Trigger | ${{ github.event_name }} |"
            echo "| Commit | ${GITHUB_SHA::7} |"
            echo ""
            echo "Detailed results are in the **Check links with lychee** step summary of the link-check job."
            echo ""
            echo "*Runs weekly to ensure educational content remains accessible, and on pushes that touch docs or the link-check config.*"
          } >> "$GITHUB_STEP_SUMMARY"
