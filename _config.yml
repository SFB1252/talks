# Site settings
title: 'Research Data and Methods Workshop Series'
description: 'Workshop series on research data management, ethics, literature management, and corpus linguistics tools.'
baseurl: '/talks'
url: 'https://sfb1252.github.io'

# Organization information
organization:
  name: 'CRC 1252 - Prominence in Language'
  website: 'https://sfb1252.uni-koeln.de'
  university: 'University of Cologne'

# Current semester configuration
current_semester:
  name: 'Winter 2025-26'
  status: 'active'
  schedule_file: 'winter-2025-26-schedule'
  start_date: '2025-09-17'
  end_date: '2025-11-26'

# Workshop logistics
workshop_logistics:
  frequency: 'Every second Wednesday'
  duration: '14:00 - 15:30'
  location: 'House of Prominence, Attic (Top floor), Luxemburger Str. 299'
  contact_email: 'sfb1252-service@uni-koeln.de'

# Author information
author:
  name: 'CRC 1252 - Prominence in Language'
  email: 'sfb1252-service@uni-koeln.de'
  affiliation: 'University of Cologne'

# Build settings
markdown: kramdown
highlighter: rouge

# Academic theme configuration
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Navigation
header_pages:
  - index.md
  - agenda/winter-2025-26-schedule.md
  - workshops/01-good-academic-practice/README.md
  - workshops/02-research-data-management/README.md
  - workshops/03-ethics-approval/README.md
  - workshops/04-literature-management/README.md
  - workshops/05-annotation-corpus-tools/README.md
  - workshops/06-preregistration/README.md
  - onboarding/README.md
  - docs/contributing.md
  - resources/additional-links.md

# Collections
collections:
  workshops:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ''
      type: 'posts'
    values:
      layout: 'post'
      author: 'CRC 1252'
  - scope:
      path: ''
      type: 'workshops'
    values:
      layout: 'workshop'
  - scope:
      path: ''
    values:
      layout: 'default'

# Academic features
scholar:
  style: apa
  locale: en
  sort_by: year
  order: descending

# Exclude files from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
